<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Access</title>

  <style>
    :root {
      --max-width: 420px;
      --page-padding: 16px;
      --topbar-height: 56px;
      --primary-color: #0f1a4a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: var(--primary-color);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top menu bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      z-index: 1000;
      box-shadow: 0 1px 0 rgba(15,26,74,0.08) inset;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none; /* 取消超連結底線 */
    }

    /* 當登入後，讓 Logo 變成可以點擊的按鈕（維持原本外觀） */
    .logo.clickable {
      cursor: pointer;
    }

    .logo img {
      width: 28px;
      height: 28px;
      display: block;
      flex: 0 0 28px;
    }

    .brand {
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    /* Page wrapper - mobile-first */
    .page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--topbar-height) + var(--page-padding)) var(--page-padding) var(--page-padding);
      box-sizing: border-box;
      text-align: center;
      display: none; /* 預設全部隱藏，由 JS 控制顯示 */
    }

    /* 初始顯示登入頁 */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--topbar-height));
      padding-top: calc(var(--topbar-height) + var(--page-padding));
      padding-bottom: var(--page-padding);
    }

    .box {
      background: #f5f8ff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      text-align: left;
    }

    .password-row {
      position: relative;
      margin-top: 12px;
    }

    .password-row input {
      width: 100%;
      padding-right: 46px;
      line-height: 1.2;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-58%);
      width: auto;
      border: none;
      background: transparent;
      padding: 0;
      height: 100%;
      cursor: pointer;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      background: transparent;
    }

    .password-reminder {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7280;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #152a70;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
      display: none;
    }

    /* Cloud Page (原本的相片同字) */
    .photo {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 8px 0 0 0;
      display: block;
      object-fit: cover;
    }

    .caption {
      margin-top: 10px;
      font-size: 15px;
      color: #3b4f8a;
      text-align: left;
    }

    .page-title {
      margin: 0 0 16px 0;
      font-size: 28px;
      font-weight: 700;
      text-align: left;
      color: var(--primary-color);
    }

    /* 偽裝主頁與備份選單樣式 */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: #f5f8ff;
      border-radius: 12px;
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid rgba(15,26,74,0.05);
    }

    .menu-item:hover {
      background: #eaf0ff;
    }

    .menu-item .icon-placeholder {
      margin-right: 12px;
      font-size: 20px;
    }

    .menu-item .details {
      flex: 1;
    }

    .menu-item .sub-text {
      font-size: 12px;
      color: #6b7280;
      font-weight: normal;
      margin-top: 2px;
    }

    /* Smaller screens tweaks */
    @media (max-width: 420px) {
      .box { padding: 16px; border-radius: 12px; }
      .brand { display: none; }
    }
  </style>
</head>

<body>

  <!-- Top menu bar with cloud logo -->
  <header class="topbar">
    <!-- 加入 id="topbarLogo" 方便 JS 切換點擊事件，預設不跳轉 -->
    <div id="topbarLogo" class="logo" onclick="goToDashboard()">
      <img src="image/cloud.png" alt="Cloud" class="cloud-logo" />
      <span class="brand">Cloud</span>
    </div>
  </header>

  <!-- 1. Landing Page (密碼登入) -->
  <div id="loginPage" class="page" style="display: flex;">
    <div class="box">
      <h1>你好，鄭凱峯</h1>
      <p>輸入密碼以存取雲端儲存中的受保護檔案。</p>

      <div class="password-row">
        <input type="password" id="passwordInput" placeholder="密碼" onblur="handlePasswordBlur()" />
        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility()">
          <img id="passwordIcon" src="image/eye.png" alt="Show password" width="20" height="20" />
        </button>
      </div>
      
      <div class="password-reminder">提示：他的生日 (格式：MMDD)</div>

      <button onclick="checkPassword()">登入</button>

      <div id="errorMessage" class="error">密碼錯誤</div>
    </div>
  </div>

  <!-- 2. Cloud Page (原本的相片與文字頁面) -->
  <div id="cloudPage" class="page">
    <h1 class="page-title">雲端檔案</h1>
    <img src="image/stealingcat.png" alt="Cloud evidence photo" class="photo" />
    <div class="caption">
      檔案上傳於2098年9月21日，晚上10:47。
      希望件事唔係我諗嘅咁啦。。。
    </div>
  </div>

  <!-- 3. Hidden Dashboard (點擊 Icon 後出現的隱藏主頁) -->
  <div id="dashboardPage" class="page">
    <h1 class="page-title">系統控制台</h1>
    
    <div class="menu-list">
      <!-- 偽裝選項 A -->
      <div class="menu-item">
        <span class="icon-placeholder">⚙️</span>
        <div class="details">
          <div>帳戶安全性設定</div>
          <div class="sub-text">上次檢查時間：2小時前</div>
        </div>
      </div>

      <!-- 偽裝選項 B -->
      <div class="menu-item">
        <span class="icon-placeholder">📊</span>
        <div class="details">
          <div>儲存空間分析</div>
          <div class="sub-text">已使用 45.2 GB / 100 GB</div>
        </div>
      </div>

      <!-- 真正的暗道：news.com backup -->
      <div class="menu-item" onclick="openSecretNews()">
        <span class="icon-placeholder">🌐</span>
        <div class="details">
          <div>news.com backup</div>
          <div class="sub-text">備份日期：2026-05-20</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const correctPassword = "1005";
    let revealTimeout;
    let isLoggedIn = false; // 追蹤登入狀態

    function setPasswordIcon(isVisible) {
      const toggleButton = document.getElementById('togglePassword');
      const icon = document.getElementById('passwordIcon');
      icon.src = isVisible ? 'image/eye-off.png' : 'image/eye.png';
      icon.alt = isVisible ? 'Hide password' : 'Show password';
      toggleButton.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const isHidden = passwordInput.type === 'password';

      if (isHidden) {
        passwordInput.type = 'text';
        setPasswordIcon(true);
        clearTimeout(revealTimeout);
        revealTimeout = setTimeout(() => {
          passwordInput.type = 'password';
          setPasswordIcon(false);
        }, 3000);
      } else {
        passwordInput.type = 'password';
        setPasswordIcon(false);
        clearTimeout(revealTimeout);
      }
    }

    function handlePasswordBlur() {
      const passwordInput = document.getElementById('passwordInput');
      if (passwordInput.type === 'text') {
        passwordInput.type = 'password';
        setPasswordIcon(false);
        clearTimeout(revealTimeout);
      }
    }

    // 檢查登入密碼
    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        isLoggedIn = true;
        // 激活頂部 Logo 變成可點擊狀態
        document.getElementById("topbarLogo").classList.add("clickable");
        
        // 前往原本的相片頁
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("cloudPage").style.display = "block";
        window.scrollTo({top:0,behavior:'smooth'});
      } else {
        error.style.display = "block";
      }
    }

    // 隱藏機制：登入後點擊頂部 Logo 跳轉到隱藏主頁
    function goToDashboard() {
      if (!isLoggedIn) return; // 未登入點擊無效

      // 隱藏其他頁面，顯示偽裝主頁
      document.getElementById("cloudPage").style.style.display = "none";
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("dashboardPage").style.display = "block";
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // 點擊 news.com backup 打開隱藏的圖片
    function openSecretNews() {
      window.open('image/news.png', '_blank');
    }
  </script>

</body>
</html>
